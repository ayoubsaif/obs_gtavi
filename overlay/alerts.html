<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Alertas Twitch</title>
<link rel="stylesheet" href="common.css">
<style>
  html, body { background: transparent; }
  body.preview { background: url("img/Jason_and_Lucia_03.jpg") center/cover; }

  #fx { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }

  /* --s = size of the alert (config.js → subs.alertScale); scaled from the top centre */
  .alert { --s: .43; position: absolute; left: 50%; top: 60px; width: 900px; transform: translateX(-50%) scale(var(--s));
           transform-origin: 50% 0; text-align: center; opacity: 0; pointer-events: none; }
  .alert.show { animation: alertIn .9s cubic-bezier(.2,.9,.25,1.2) both; }
  .alert.hide { animation: alertOut .6s ease-in both; }
  @keyframes alertIn  { from { opacity: 0; transform: translateX(-50%) translateY(-40px) scale(calc(var(--s) * .85)); } to { opacity: 1; transform: translateX(-50%) scale(var(--s)); } }
  @keyframes alertOut { from { opacity: 1; transform: translateX(-50%) scale(var(--s)); } to { opacity: 0; transform: translateX(-50%) translateY(-30px) scale(calc(var(--s) * .95)); } }

  .alert .kicker { font-size: 58px; }
  .plate { position: relative; margin: 0 auto; padding: 26px 48px 30px;
           background: linear-gradient(180deg, rgba(18,8,31,.92), rgba(42,24,70,.88));
           border-top: 5px solid transparent; border-image: var(--sunset) 1;
           box-shadow: 0 20px 60px rgba(0,0,0,.45), 0 0 60px rgba(255,79,163,.35); overflow: hidden; }
  .plate::before { content: ""; position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.18) 50%, transparent 70%);
    transform: translateX(-120%); animation: sweep 2.4s .4s ease-in-out infinite; }
  @keyframes sweep { 55%, 100% { transform: translateX(120%); } }

  .who { font-family: var(--display); font-weight: 500; font-size: 64px; letter-spacing: 2px; line-height: 1.05; }
  .verb { font-family: var(--deco); font-size: 26px; letter-spacing: 8px; text-transform: uppercase; color: var(--orange); margin-top: 6px; }
  .big { font-family: var(--display); font-weight: 500; font-size: 118px; line-height: 1.05; margin-top: 4px;
         background: var(--sunset); -webkit-background-clip: text; background-clip: text; color: transparent;
         filter: drop-shadow(0 5px 0 rgba(18,8,31,.9)) drop-shadow(0 0 26px rgba(255,177,94,.55)); }
  .alert.cheer .big { background: linear-gradient(100deg, #3ff2ff, #a86bff 55%, #ff4fa3); -webkit-background-clip: text; background-clip: text; }
  .msg { margin: 14px auto 0; max-width: 760px; font-size: 32px; font-weight: 600; line-height: 1.25; opacity: .95; }
  .msg:empty { display: none; }
  .tier { display: none; margin-top: 12px; font-family: var(--deco); font-size: 22px; letter-spacing: 10px; color: var(--cyan);
          text-shadow: 0 0 14px rgba(63,242,255,.8); }
  .alert.huge .tier { display: block; }
  .alert.huge .plate { box-shadow: 0 20px 60px rgba(0,0,0,.45), 0 0 90px rgba(255,177,94,.6); }
</style>
</head>
<body>
<canvas id="fx" width="1920" height="1080"></canvas>

<div class="alert" id="alert">
  <div class="kicker" id="kicker"></div>
  <div class="plate">
    <div class="who" id="who"></div>
    <div class="verb" id="verb"></div>
    <div class="big" id="big"></div>
    <div class="tier">★ Pez gordo ★</div>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="common.js"></script>
<script src="twitch.js"></script>
<script>
/*
 * Alertas de Twitch: sub nueva, resub, subs regaladas y bits.
 * Datos: twitch.js (EventSub en directo si hay token en config.js, o eventos de StreamElements).
 * Prueba: ?test=1 (alertas de ejemplo cada 10 s, no tocan la lista real) · ?preview=1 fondo de juego · ?mute=1 sin sonido.
 */
(function () {
  const { config, query } = Overlay;
  const S = config.subs || {};
  const SHOW_MS = 7500;
  const el = document.getElementById("alert");
  const SCALE = Math.min(1, Math.max(.2, +(query.get("scale") || S.alertScale) || .43));
  el.style.setProperty("--s", SCALE);
  const K = Math.max(.5, SCALE);            // particles shrink with the alert, but stay visible
  const queue = []; let busy = false;

  // ---------- sound (config.js → subs.alertSound / subs.alertVolume; ?mute=1 silences it) ----------
  const sound = S.alertSound === false || query.get("mute") === "1" ? null
    : new Audio(S.alertSound || "../assets/sounds/alert_sound.mp3");
  if (sound) { sound.preload = "auto"; sound.volume = Math.min(1, Math.max(0, S.alertVolume ?? .8)); }
  function ding() {
    if (!sound) return;
    sound.currentTime = 0;
    sound.play().catch(() => {});   // a normal browser may block autoplay until you click; OBS doesn't
  }

  // ---------- canvas particles ----------
  const cv = document.getElementById("fx"), ctx = cv.getContext("2d");
  const COLORS = ["#ffb15e", "#ff4fa3", "#6b4fe0", "#3ff2ff", "#fff7fb"];
  let parts = [], running = false;

  function burst(count, kind) {
    const cx = 960, cy = el.offsetTop + el.offsetHeight * SCALE / 2;   // centre of the (scaled) alert
    count = Math.round(count * K);
    for (let i = 0; i < count; i++) {
      const special = Math.random() < .3;
      const shape = special ? (kind === "cheer" ? "gem" : "star") : "confetti";
      const a = Math.random() * Math.PI * 2, sp = (6 + Math.random() * 14) * K;
      parts.push({ shape, x: cx + (Math.random() - .5) * 300 * SCALE, y: cy + (Math.random() - .5) * 80 * SCALE,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 8 * K, rot: Math.random() * 6.28, vr: (Math.random() - .5) * .25,
        flip: Math.random() * 6.28, vf: .08 + Math.random() * .15,
        color: kind === "cheer" && special ? ["#3ff2ff", "#a86bff", "#ff4fa3"][(Math.random() * 3) | 0] : COLORS[(Math.random() * COLORS.length) | 0],
        size: (shape === "confetti" ? 8 + Math.random() * 8 : 16 + Math.random() * 12) * K,
        life: 0, max: 160 + Math.random() * 120 });
    }
    if (!running) { running = true; requestAnimationFrame(step); }
  }
  function star(r) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * .45 : r, a = i * Math.PI / 5 - Math.PI / 2; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill();
  }
  function gem(r, c) {  // bits-style crystal
    ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r * .8, -r * .1); ctx.lineTo(0, r); ctx.lineTo(-r * .8, -r * .1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.45)"; ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r * .8, -r * .1); ctx.lineTo(0, -r * .1); ctx.closePath(); ctx.fill();
  }
  function step() {
    ctx.clearRect(0, 0, 1920, 1080);
    parts = parts.filter(p => p.life < p.max && p.y < 1140);
    for (const p of parts) {
      p.life++; p.vx *= .985; p.vy = p.vy * .985 + .3; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.flip += p.vf;
      ctx.save(); ctx.globalAlpha = Math.min(1, (p.max - p.life) / 40); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      if (p.shape === "star") { ctx.scale(Math.cos(p.flip) * .5 + .7, 1); ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 12; star(p.size); }
      else if (p.shape === "gem") { ctx.scale(Math.abs(Math.cos(p.flip)) * .7 + .3, 1); gem(p.size, p.color); }
      else { ctx.scale(1, Math.cos(p.flip)); ctx.fillStyle = p.color; ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); }
      ctx.restore();
    }
    if (parts.length) requestAnimationFrame(step); else { running = false; ctx.clearRect(0, 0, 1920, 1080); }
  }

  // ---------- texts per alert type ----------
  const tierTxt = t => t === "3000" ? "Nivel 3" : t === "2000" ? "Nivel 2" : "";
  function content(a) {
    switch (a.kind) {
      case "sub":   return { kicker: "¡Nuevo sub!", verb: "se ha suscrito", big: tierTxt(a.tier) ? "SUB " + tierTxt(a.tier) : "SUB", huge: a.tier === "3000" };
      case "resub": return { kicker: "¡Sigue en la banda!", verb: "lleva suscrito", big: `${a.months || 1} ${(a.months || 1) === 1 ? "MES" : "MESES"}`, huge: (a.months || 0) >= (S.bigMonths || 12) };
      case "gift":  return { kicker: "¡Lluvia de regalos!", verb: "ha regalado", big: `${a.count || 1} ${(a.count || 1) === 1 ? "SUB" : "SUBS"}`, huge: (a.count || 0) >= (S.bigGift || 5) };
      case "cheer": return { kicker: "¡Han caído bits!", verb: "ha enviado", big: `${a.bits} BITS`, huge: (a.bits || 0) >= (S.bigBits || 1000) };
    }
  }

  function play(a) {
    busy = true;
    const c = content(a);
    document.getElementById("kicker").textContent = c.kicker;
    document.getElementById("who").textContent = a.name || "Anónimo";
    document.getElementById("verb").textContent = c.verb;
    document.getElementById("big").textContent = c.big;
    document.getElementById("msg").textContent = (a.message || "").slice(0, 160);
    el.classList.toggle("huge", !!c.huge);
    el.classList.toggle("cheer", a.kind === "cheer");
    el.classList.remove("hide"); void el.offsetWidth; el.classList.add("show");
    ding();
    burst(c.huge ? 220 : 110, a.kind);
    if (c.huge) setTimeout(() => burst(120, a.kind), 700);
    setTimeout(() => {
      el.classList.remove("show"); el.classList.add("hide");
      setTimeout(() => { busy = false; if (queue.length) play(queue.shift()); }, 900);
    }, SHOW_MS);
  }
  const show = a => { if (!content(a)) return; busy ? queue.push(a) : play(a); };

  Overlay.twitch.on("alert", show);

  if (query.get("preview") === "1") document.body.classList.add("preview");
  if (query.get("test") === "1") {
    const samples = [
      { kind: "sub", name: "Lucia_Fan", tier: "1000" },
      { kind: "resub", name: "ViceCityVIP", months: 14, message: "¡Un año más en Leonida! 🌴" },
      { kind: "gift", name: "JasonDuval_ES", count: 5 },
      { kind: "cheer", name: "PalmeraNeon", bits: 500, message: "¡Pilla ese coche para la huida!" }
    ];
    let i = 0;
    const fire = () => show(samples[i++ % samples.length]);   // only the alert, list/goal untouched
    setTimeout(fire, 800); setInterval(fire, 10000);
  }
})();
</script>
</body>
</html>
