<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Empezamos en breve</title>
<link rel="stylesheet" href="common.css">
<style>
  .bg { background-image: url("img/Jason_Lucia_Rooftop_landscape.jpg"); background-position: 70% 30%; }
  .shade {
    background:
      linear-gradient(90deg, rgba(18,8,31,.92) 0%, rgba(42,24,70,.75) 32%, rgba(42,24,70,0) 60%),
      linear-gradient(0deg, rgba(18,8,31,.7) 0%, transparent 30%);
  }
  .copy { position: absolute; left: 120px; top: 230px; width: 900px; }
  .copy .subtitle { margin-top: 26px; }
  .count-wrap { margin-top: 40px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
  .count-label { font-size: 26px; letter-spacing: 6px; text-transform: uppercase; font-weight: 700; color: var(--orange); line-height: 1.2; }
  .bar { margin-top: 30px; width: 640px; height: 8px; background: rgba(255,255,255,.12); border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--sunset); box-shadow: 0 0 16px var(--pink); transition: width 1s linear; }
  .ticker { bottom: 96px; }
  /* Right column: subs card on top, chat card fills the rest down to the ticker */
  .side { position: absolute; right: 60px; top: 60px; bottom: 176px; width: 560px; display: flex; flex-direction: column; gap: 22px; }
  .side .support-card { position: static; width: auto; }
  .chat-card { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .chat-card .feed {
    flex: 1; min-height: 0; margin-top: 12px; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 8px;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 60px);
            mask-image: linear-gradient(to bottom, transparent 0, #000 60px);
  }
  .chat-card .feed .msg { background: rgba(255,255,255,.06); }
  .live-dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--hot); box-shadow: 0 0 12px var(--hot); margin-right: 12px; vertical-align: middle; }

  /* ---------- ?cam=1 (starting-soon-cam.html): webcam replaces the subs card, 560x315 at x=1300, y=589 ----------
     The page cuts a transparent hole there; the webcam source sits UNDER this browser source.
     The chat card moves to the top of the column and ends 22px above the cam label (y=565). */
  .cam { display: none; position: absolute; left: 1300px; top: 589px; width: 560px; height: 315px; }
  html.with-cam.has-scene { background: transparent; }
  html.with-cam .scene { clip-path: path(evenodd, "M0 0H1920V1080H0Z M1300 589H1860V904H1300Z"); }
  html.with-cam .side { bottom: 537px; }
  html.with-cam .subs-card { display: none; }
  html.with-cam .cam { display: block; }
  .cam .frame {
    position: absolute; inset: -6px; border-radius: 12px; padding: 6px;
    background: conic-gradient(from var(--a, 0deg), var(--orange), var(--pink), var(--purple), var(--cyan), var(--orange));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    filter: drop-shadow(0 0 14px rgba(255,79,163,.7));
    animation: spin 8s linear infinite;
  }
  @property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @keyframes spin { to { --a: 360deg; } }
  .cam .corner { position: absolute; width: 30px; height: 30px; border: 4px solid var(--white); }
  .cam .tl { left: -14px; top: -14px; border-right: 0; border-bottom: 0; }
  .cam .br { right: -14px; bottom: -14px; border-left: 0; border-top: 0; }
  .cam .label {
    position: absolute; left: 18px; top: -24px; padding: 5px 16px 5px 12px; white-space: nowrap;
    background: var(--ink); border-left: 5px solid var(--pink);
    font-family: var(--display); font-size: 22px; letter-spacing: 1.5px; text-transform: uppercase;
    display: flex; align-items: center; gap: 10px;
  }
  .cam .label .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--hot); box-shadow: 0 0 10px var(--hot); }
  .cam .script { position: absolute; right: 16px; bottom: 8px; white-space: nowrap; font-family: var(--script); font-size: 38px; color: var(--cyan);
                 text-shadow: 0 0 12px rgba(63,242,255,.8), 0 2px 0 var(--ink); transform: rotate(-4deg); }
</style>
<script>if (new URLSearchParams(location.search).get("cam") === "1") document.documentElement.classList.add("with-cam");</script>
</head>
<body data-intro-img="img/Jason_Lucia_Rooftop_landscape.jpg" data-intro-title="EMPEZAMOS|EN BREVE">
<div class="scene">
  <canvas class="album" data-album data-fallback="img/Jason_Lucia_Rooftop_landscape.jpg"></canvas>
  <div class="shade"></div>
  <div class="scanlines"></div>
  <div class="grain"></div>

  <div class="copy">
    <div class="kicker rise">Bienvenidos a Leonida</div>
    <h1 class="title rise d1">Empezamos<br>en breve</h1>
    <div class="subtitle rise d2"><span class="live-dot pulse"></span><span data-channel></span> · <span data-game></span></div>
    <div class="count-wrap rise d3">
      <div class="count-label" id="label">Pilla algo de beber. Arrancamos en</div>
      <div class="timer" id="timer">00:00:00</div>
    </div>
    <div class="bar rise d3"><i id="bar"></i></div>
  </div>

  <div class="side">
    <div class="support-card subs-card rise d3">
      <div class="lbl">Apoya el directo</div>
      <div class="line" data-support-line></div>
      <div class="note" data-support-note></div>
      <div class="goal"></div>
      <div class="last-subs"></div>
    </div>

    <div class="support-card chat-card rise d3">
      <div class="lbl">Chat en directo</div>
      <div class="feed" data-chat></div>
    </div>
  </div>

  <div class="ticker"><div class="ticker-track"></div></div>
  <div class="socials"></div>
</div>

<!-- outside .scene so the hole's clip-path doesn't cut the frame -->
<div class="cam rise d3">
  <div class="frame"></div>
  <div class="corner tl"></div><div class="corner br"></div>
  <div class="label"><span class="dot pulse"></span><span data-channel></span></div>
  <div class="script">Vice City</div>
</div>

<script src="config.js"></script>
<script src="common.js"></script>
<script src="twitch.js"></script>
<script src="album.js"></script>
<script src="hero-intro.js"></script>
<script src="chat.js"></script>
<script>
  const { config, query, pad } = window.Overlay;
  const hms = s => { s = Math.max(0, Math.floor(s));
    return pad(Math.floor(s / 3600)) + ":" + pad(Math.floor(s / 60) % 60) + ":" + pad(s % 60); };

  // Seconds until the next HH:MM:SS wall-clock time in the given time zone (independent of the PC's zone).
  function secondsUntil(target, timeZone) {
    const [th, tm, ts] = target.split(":").map(Number);
    const parts = Object.fromEntries(new Intl.DateTimeFormat("en-GB", {
      timeZone, hourCycle: "h23", hour: "2-digit", minute: "2-digit", second: "2-digit"
    }).formatToParts(new Date()).map(p => [p.type, +p.value]));
    const now = parts.hour * 3600 + parts.minute * 60 + parts.second + (Date.now() % 1000) / 1000;
    let left = th * 3600 + tm * 60 + (ts || 0) - now;
    if (left <= 0) left += 86400;
    return left;
  }

  const mins = parseFloat(query.get("minutes"));       // ?minutes=10 still forces a plain countdown
  const total = mins ? mins * 60
    : secondsUntil(query.get("at") || config.countdownTo || "00:00:00", config.countdownZone || "Europe/Madrid");
  const end = Date.now() + total * 1000;
  const t = document.getElementById("timer"), b = document.getElementById("bar"), l = document.getElementById("label");
  function tick() {
    const left = (end - Date.now()) / 1000;
    if (left <= 0) { t.textContent = "00:00:00"; l.textContent = "En cualquier momento…"; b.style.width = "100%"; return; }
    t.textContent = hms(Math.ceil(left));
    b.style.width = (100 * (1 - left / total)) + "%";
    setTimeout(tick, 250);
  }
  tick();
</script>
</body>
</html>
