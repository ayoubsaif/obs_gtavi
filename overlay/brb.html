<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Vuelvo enseguida</title>
<link rel="stylesheet" href="common.css">
<style>
  .bg { background-image: url("img/Jason_and_Lucia_Robbery_landscape.jpg"); background-position: 75% 40%; }
  .shade {
    background:
      linear-gradient(90deg, rgba(18,8,31,.9) 0%, rgba(42,24,70,.7) 30%, rgba(42,24,70,0) 55%),
      linear-gradient(0deg, rgba(18,8,31,.75) 0%, transparent 28%);
  }
  .copy { position: absolute; left: 120px; top: 250px; width: 900px; }
  .copy .subtitle { margin-top: 26px; }
  .away { margin-top: 56px; display: inline-flex; align-items: center; gap: 24px;
          padding: 18px 30px; background: rgba(18,8,31,.7); border-left: 6px solid var(--cyan); }
  .away .lbl { font-size: 26px; font-weight: 700; letter-spacing: 6px; text-transform: uppercase; color: var(--cyan); }
  .away .timer { font-size: 64px; letter-spacing: 3px; }
  .hint { margin-top: 30px; font-size: 28px; letter-spacing: 2px; opacity: .85; }
  .hint b { color: var(--orange); }
  .ticker { bottom: 96px; }
</style>
</head>
<body data-intro-img="img/Jason_and_Lucia_Robbery_landscape.jpg" data-intro-title="VUELVO|ENSEGUIDA">
<div class="scene">
  <div class="bg"></div>
  <div class="shade"></div>
  <div class="scanlines"></div>
  <div class="grain"></div>

  <div class="copy">
    <div class="kicker rise">Escondido un ratito</div>
    <h1 class="title rise d1">Vuelvo<br>enseguida</h1>
    <div class="subtitle rise d2">No toquéis el coche de la huida</div>
    <div class="away rise d3"><span class="lbl">Ausente</span><span class="timer" id="away">00:00</span></div>
    <div class="hint rise d3">Mantened vivo el chat — <b>escribe !lurk</b> si te quedas</div>
  </div>

  <div class="support-card rise d3">
    <div class="lbl">Apoya el directo</div>
    <div class="line" data-support-line></div>
    <div class="note" data-support-note></div>
    <div class="goal"></div>
    <div class="last-subs"></div>
  </div>

  <div class="ticker"><div class="ticker-track"></div></div>
  <div class="socials"></div>
</div>

<script src="config.js"></script>
<script src="common.js"></script>
<script src="twitch.js"></script>
<script src="hero-intro.js"></script>
<script>
  const start = Date.now(), el = document.getElementById("away");
  setInterval(() => el.textContent = Overlay.fmt((Date.now() - start) / 1000), 500);
</script>
</body>
</html>
